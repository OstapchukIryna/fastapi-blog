$kind: http-request
description: "Deleting is the one that cannot be undone, so it is worth asserting separately from the two that only overwrite."
url: "{{baseUrl}}/api/posts/{{guardedPostId}}"
method: DELETE
headers:
  Authorization: Bearer {{intruderToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403 Forbidden, not 401", () => pm.response.to.have.status(403));

      pm.test("refused for permission, not identity", () =>
          pm.expect(pm.response.json().detail).to.eql("Not authorized to edit this post"));
    language: text/javascript
order: 4000
