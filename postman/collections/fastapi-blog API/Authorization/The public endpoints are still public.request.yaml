$kind: http-request
description: "The other half of the same rule, and the one a security change is likely to break by accident: reading this blog must not need an account. Locking down a router is a one-line mistake away from locking down its reads too."
url: "{{baseUrl}}/api/v1/posts"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const base = pm.variables.get("baseUrl");
      const post = pm.collectionVariables.get("guardedPostId");
      const user = pm.collectionVariables.get("userId");

      const open = [
          { name: "GET /api/v1/posts", url: `${base}/api/v1/posts` },
          { name: "GET /api/v1/posts/{id}", url: `${base}/api/v1/posts/${post}` },
          { name: "GET /api/v1/tags", url: `${base}/api/v1/tags` },
          { name: "GET /api/v1/users/{id}", url: `${base}/api/v1/users/${user}` },
          { name: "GET /api/v1/users/{id}/posts", url: `${base}/api/v1/users/${user}/posts` },
      ];

      const seen = [];
      const next = (i) => {
          if (i === open.length) {
              pm.collectionVariables.set("publicSweep", JSON.stringify(seen));
              return;
          }
          pm.sendRequest({ url: open[i].url, method: "GET" }, (_e, res) => {
              seen.push({ name: open[i].name, code: res ? res.code : 0 });
              next(i + 1);
          });
      };
      next(0);
    language: text/javascript
  - type: afterResponse
    code: |-
      const seen = JSON.parse(pm.collectionVariables.get("publicSweep") || "[]");

      pm.test("all five were tried", () => pm.expect(seen).to.have.lengthOf(5));

      seen.forEach((it) =>
          pm.test(`${it.name} needs no account`, () =>
              pm.expect(it.code, `${it.name} answered ${it.code}`).to.eql(200)));

      pm.collectionVariables.unset("publicSweep");
    language: text/javascript
order: 9000
