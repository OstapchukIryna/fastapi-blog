$kind: http-request
description: "Deleting a user cascades to every post they wrote, so this is the single most destructive call in the API."
url: "{{baseUrl}}/api/users/{{userId}}"
method: DELETE
headers:
  Authorization: Bearer {{intruderToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("403 Forbidden, not 401", () => pm.response.to.have.status(403));

      pm.test("refused for permission, not identity", () =>
          pm.expect(pm.response.json().detail).to.eql("Not authorized to change profile"));
    language: text/javascript
order: 6000
