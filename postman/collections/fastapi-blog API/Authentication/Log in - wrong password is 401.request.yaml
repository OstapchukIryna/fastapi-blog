$kind: http-request
description: The same message whether the address or the password was wrong, so the response cannot be used to find out which addresses are registered.
url: "{{baseUrl}}/api/v1/users/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content: |-
    username={{newEmail}}&password=not-the-password
scripts:
  - type: afterResponse
    code: |-
      pm.test("401 Unauthorized", () => pm.response.to.have.status(401));

      pm.test("does not say which half was wrong", () =>
          pm.expect(pm.response.json().detail).to.eql("Incorrect password or email"));

      pm.test("challenges with Bearer", () =>
          pm.expect(pm.response.headers.get("WWW-Authenticate")).to.eql("Bearer"));
    language: text/javascript
order: 2000
