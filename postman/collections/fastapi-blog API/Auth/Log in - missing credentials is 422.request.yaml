$kind: http-request
description: "The form body is required, so an empty one is a validation failure rather than a refused sign-in. 422 and not 401: nothing was checked, so nothing was rejected."
url: "{{baseUrl}}/api/users/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content: |-
    username=&password=
scripts:
  - type: afterResponse
    code: |-
      pm.test("422 Unprocessable Content", () => pm.response.to.have.status(422));

      pm.test("names both missing fields", () => {
          const fields = pm.response.json().detail.map((e) => e.loc[e.loc.length - 1]);
          pm.expect(fields).to.include("username");
          pm.expect(fields).to.include("password");
      });
    language: text/javascript
order: 1500
