$kind: http-request
description: Whether the app can reach its own database, checked the same way anything else watching this service would.
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("reports ok", () =>
          pm.expect(pm.response.json()).to.eql({ status: "ok" }));
    language: text/javascript
order: 500
