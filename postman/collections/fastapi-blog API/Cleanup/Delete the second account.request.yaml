$kind: http-request
description: "The 403 test needed a second person to be refused. Removing them here keeps the promise the collection makes about itself: run it as often as you like and the database is as it was."
url: "{{baseUrl}}/api/users/{{intruderId}}"
method: DELETE
headers:
  Authorization: Bearer {{intruderToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("204 No Content", () => pm.response.to.have.status(204));

      ["intruderToken", "intruderId"].forEach((v) =>
          pm.collectionVariables.unset(v));
    language: text/javascript
order: 500
