$kind: http-request
description: Deleting a user cascades to their posts, so the run leaves the database as it found it.
url: "{{baseUrl}}/api/v1/users/{{userId}}"
method: DELETE
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: pm.test("204 No Content", () => pm.response.to.have.status(204));
    language: text/javascript
order: 1000
