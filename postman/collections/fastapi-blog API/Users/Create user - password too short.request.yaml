$kind: http-request
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "pm_short_pw",
      "email": "pm_short_pw@example.com",
      "password": "short"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("422 Unprocessable Content", () => pm.response.to.have.status(422));

      pm.test("reports the minimum length in ctx", () => {
          const error = pm.response.json().detail.find(
              (e) => e.loc[e.loc.length - 1] === "password");
          pm.expect(error, "no error for password").to.exist;
          pm.expect(error.ctx.min_length).to.eql(8);
      });
    language: text/javascript
order: 4000
