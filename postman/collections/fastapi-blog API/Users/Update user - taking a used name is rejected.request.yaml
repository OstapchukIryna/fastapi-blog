$kind: http-request
description: The uniqueness check runs against the other rows, so claiming a name that belongs to somebody else is a 400 and not an IntegrityError.
url: "{{baseUrl}}/api/users/{{userId}}"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{takenUsername}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // A second, throwaway account exists just so this run's user can try
      // (and fail) to take its name — self-contained, not seeded ahead of
      // time.
      const base = pm.variables.get("baseUrl");
      const stamp = Date.now();
      const username = `pm_taken_${stamp}`;

      pm.sendRequest({
          url: `${base}/api/users`,
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({
                  username,
                  email: `pm_taken_${stamp}@example.com`,
                  password: "correct-horse-battery",
              }),
          },
      }, () => {
          pm.collectionVariables.set("takenUsername", username);
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("400 Bad Request", () => pm.response.to.have.status(400));
      pm.test("names the conflict", () =>
          pm.expect(pm.response.json().detail).to.eql("Username or email already registered"));
    language: text/javascript
order: 8000
