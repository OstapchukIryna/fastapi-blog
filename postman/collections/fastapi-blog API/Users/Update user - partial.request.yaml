$kind: http-request
description: "PATCH applies only the fields that arrived; an omitted one is left alone rather than nulled. The picture is no longer among them — a filename is not something a client gets to choose, so it moved to its own endpoint that takes the file itself."
url: "{{baseUrl}}/api/users/{{userId}}"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{renamedUsername}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set(
          "renamedUsername",
          `${pm.collectionVariables.get("newUsername")}_renamed`.slice(-50));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const user = pm.response.json();
      const renamed = pm.collectionVariables.get("renamedUsername");

      pm.test("changes the field that was sent", () =>
          pm.expect(user.username).to.eql(renamed));

      pm.test("leaves the address alone", () => {
          pm.sendRequest({
              url: `${pm.variables.get("baseUrl")}/api/users/me`,
              method: "GET",
              header: { Authorization: `Bearer ${pm.collectionVariables.get("accessToken")}` },
          }, (_e, res) =>
              pm.expect(res.json().email)
                  .to.eql(pm.collectionVariables.get("newEmail").toLowerCase()));
      });

      // Дальше по прогону имя сверяют с этой переменной.
      pm.collectionVariables.set("newUsername", renamed);
      pm.collectionVariables.unset("renamedUsername");
    language: text/javascript
order: 7000
