$kind: http-request
description: >-
  Holding a token is not enough. Somebody at an unlocked laptop should not
  be able to lock the owner out — which is what this check buys, and all
  it buys: whoever holds the token can still do plenty else.
url: "{{baseUrl}}/api/v1/users/me/password"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "current_password": "definitely-not-the-password",
      "new_password": "WouldBeNewPassword1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 Bad Request", () => pm.response.to.have.status(400));

      pm.test("says which field was wrong", () =>
          pm.expect(pm.response.json().detail).to.be.a("string"));

      pm.test("without a token it is 401, not 400", () => {
          pm.sendRequest({
              url: `${pm.variables.get("baseUrl")}/api/v1/users/me/password`,
              method: "PATCH",
              header: { "Content-Type": "application/json" },
              body: {
                  mode: "raw",
                  raw: JSON.stringify({
                      current_password: "x",
                      new_password: "WouldBeNewPassword1",
                  }),
              },
          }, (_err, res) => pm.expect(res.code).to.eql(401));
      });
    language: text/javascript
order: 2500
