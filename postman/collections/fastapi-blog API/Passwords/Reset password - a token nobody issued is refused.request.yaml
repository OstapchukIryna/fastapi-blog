$kind: http-request
description: >-
  The happy path cannot be driven from here: the token exists only in the
  email. What can be checked is that every unusable token is refused the
  same way, so a caller holding a guess learns nothing about how close it
  was.
url: "{{baseUrl}}/api/v1/users/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "this-token-was-never-issued",
      "new_password": "IrrelevantPassword1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 Bad Request", () => pm.response.to.have.status(400));

      const refusal = pm.response.json().detail;

      pm.test("one sentence, not a diagnosis", () =>
          pm.expect(refusal).to.be.a("string"));

      // 400 rather than 404: the address exists and the request was
      // well-formed. What is wrong is the value inside it.
      pm.sendRequest({
          url: `${pm.variables.get("baseUrl")}/api/v1/users/reset-password`,
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({ token: "", new_password: "IrrelevantPassword1" }),
          },
      }, (_err, res) =>
          pm.test("an empty token is refused with the same words", () =>
              pm.expect(res.json().detail).to.eql(refusal)));

      pm.sendRequest({
          url: `${pm.variables.get("baseUrl")}/api/v1/users/reset-password`,
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({ token: "whatever", new_password: "short" }),
          },
      }, (_err, res) =>
          pm.test("a password below the floor is 422, not 400", () =>
              pm.expect(res.code).to.eql(422)));
    language: text/javascript
order: 2000
