$kind: http-request
description: >-
  Changing a password requires proving the current one. The server checks
  it — the profile page used to prove it by signing in a second time,
  because no endpoint accepted it.

  The password is rotated and then rotated back, so the run is left as it
  was found. Every other request in the collection signs in with the
  literal below, and this one must not depend on where it happens to run.
url: "{{baseUrl}}/api/v1/users/me/password"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "current_password": "correct-horse-battery",
      "new_password": "{{rotatedPassword}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("rotatedPassword", `Rotated-${Date.now()}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      pm.test("says so in words", () =>
          pm.expect(pm.response.json().message).to.be.a("string"));

      const baseUrl = pm.variables.get("baseUrl");
      const email = pm.collectionVariables.get("newEmail");
      const rotated = pm.collectionVariables.get("rotatedPassword");
      const original = "correct-horse-battery";

      const signIn = (password) =>
          new Promise((resolve) =>
              pm.sendRequest({
                  url: `${baseUrl}/api/v1/users/token`,
                  method: "POST",
                  header: { "Content-Type": "application/x-www-form-urlencoded" },
                  body: {
                      mode: "urlencoded",
                      urlencoded: [
                          { key: "username", value: email },
                          { key: "password", value: password },
                      ],
                  },
              }, (_err, res) => resolve(res)));

      (async () => {
          const withNew = await signIn(rotated);
          pm.test("the new password signs in", () =>
              pm.expect(withNew.code).to.eql(200));

          const withOld = await signIn(original);
          pm.test("and the old one no longer does", () =>
              pm.expect(withOld.code).to.eql(401));

          // Put it back, so whatever runs after this still finds the
          // password the rest of the collection uses.
          const restored = await new Promise((resolve) =>
              pm.sendRequest({
                  url: `${baseUrl}/api/v1/users/me/password`,
                  method: "PATCH",
                  header: {
                      Authorization: `Bearer ${withNew.json().access_token}`,
                      "Content-Type": "application/json",
                  },
                  body: {
                      mode: "raw",
                      raw: JSON.stringify({
                          current_password: rotated,
                          new_password: original,
                      }),
                  },
              }, (_err, res) => resolve(res)));

          pm.test("and it can be rotated back", () =>
              pm.expect(restored.code).to.eql(200));

          const again = await signIn(original);
          pm.test("leaving the run as it was found", () =>
              pm.expect(again.code).to.eql(200));

          pm.collectionVariables.set("accessToken", again.json().access_token);
          pm.collectionVariables.unset("rotatedPassword");
      })();
    language: text/javascript
order: 3000
