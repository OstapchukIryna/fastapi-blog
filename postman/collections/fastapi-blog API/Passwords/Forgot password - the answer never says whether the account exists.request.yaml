$kind: http-request
description: >-
  The point of this endpoint is what it does not say. A known address and
  an unknown one must produce the same status and the same body, or the
  form becomes a way of testing which addresses have accounts here.
url: "{{baseUrl}}/api/users/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{newEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("202 Accepted", () => pm.response.to.have.status(202));

      const known = pm.response.json();

      pm.test("says nothing definite", () =>
          pm.expect(known.message).to.be.a("string").and.to.have.length.above(0));

      pm.sendRequest({
          url: `${pm.variables.get("baseUrl")}/api/users/forgot-password`,
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({ email: `nobody_${Date.now()}@example.com` }),
          },
      }, (_err, res) => {
          pm.test("an unknown address answers with the same status", () =>
              pm.expect(res.code).to.eql(202));

          pm.test("and with the same words", () =>
              pm.expect(res.json()).to.eql(known));
      });
    language: text/javascript
order: 1000
