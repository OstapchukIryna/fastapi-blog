$kind: http-request
description: "Replacing does not accumulate: the previous file is deleted from S3, or every change would leave one behind for ever. Checked by asserting the account now points at a new, distinct file."
url: "{{baseUrl}}/api/v1/users/{{userId}}/picture"
method: PATCH
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: formdata
  content:
    - key: file
      type: file
      src: "{{pictureFile}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const user = pm.response.json();
      const replaced = user.image_file;
      const previous = pm.collectionVariables.get("firstPicture");

      pm.test("a different file than before", () =>
          pm.expect(replaced).to.not.eql(previous));

      pm.test("image_path points at the new file", () =>
          pm.expect(user.image_path).to.match(
              new RegExp(`^https://[^/]+\\.amazonaws\\.com/profile_pics/${replaced}$`)));

      pm.collectionVariables.set("firstPicture", replaced);
    language: text/javascript
order: 4000
