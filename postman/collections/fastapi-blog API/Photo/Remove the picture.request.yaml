$kind: http-request
description: "Removing falls back to the shared default rather than leaving the account without a face. The response is UserPrivate, which is the part worth pinning — without a response_model this route returned the model itself and the password hash went out with it."
url: "{{baseUrl}}/api/users/{{userId}}/picture"
method: DELETE
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const user = pm.response.json();

      pm.test("the account has no picture of its own", () =>
          pm.expect(user.image_file).to.be.null);

      pm.test("and falls back to the shared one", () =>
          pm.expect(user.image_path).to.not.include(
              pm.collectionVariables.get("firstPicture")));

      pm.test("shape is UserPrivate - no password hash", () => {
          pm.expect(Object.keys(user).sort()).to.eql(
              ["email", "id", "image_file", "image_path", "now_building", "now_next", "username"]);
          pm.expect(user).to.not.have.property("password_hash");
      });

      pm.collectionVariables.unset("firstPicture");
    language: text/javascript
order: 5000
