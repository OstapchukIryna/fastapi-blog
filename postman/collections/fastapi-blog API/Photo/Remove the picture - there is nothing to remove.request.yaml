$kind: http-request
description: Asking twice is a 400 rather than a silent success, the same way a second DELETE of a post is a 404 — the effect is the same either way, the report is honest.
url: "{{baseUrl}}/api/users/{{userId}}/picture"
method: DELETE
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 Bad Request", () => pm.response.to.have.status(400));

      pm.test("says there was nothing there", () =>
          pm.expect(pm.response.json().detail).to.eql("No picture to delete."));
    language: text/javascript
order: 6000
