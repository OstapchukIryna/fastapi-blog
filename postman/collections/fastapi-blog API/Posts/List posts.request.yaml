$kind: http-request
description: "A page of PostResponse, not PostDetail: the list deliberately carries no body text."
url: "{{baseUrl}}/api/posts"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const page = pm.response.json();

      pm.test("the envelope carries the slice and its position", () =>
          pm.expect(Object.keys(page).sort()).to.eql(
              ["has_more", "items", "limit", "skip", "total"]));

      pm.test("has_more agrees with the numbers", () =>
          pm.expect(page.has_more).to.eql(page.skip + page.items.length < page.total));

      pm.test("no more than limit came back", () =>
          pm.expect(page.items.length).to.be.at.most(page.limit));

      const posts = page.items;

      if (posts.length) {
          pm.test("shape is exactly PostResponse", () =>
              pm.expect(Object.keys(posts[0]).sort()).to.eql(
                  ["author", "date_posted", "id",
                   "reading_minutes", "summary", "tags", "title"]));

          pm.test("the list carries no content - that is PostDetail's job", () =>
              pm.expect(posts[0]).to.not.have.property("content"));

          pm.test("tags are flat strings, not objects", () => {
              pm.expect(posts[0].tags).to.be.an("array");
              posts[0].tags.forEach((t) => pm.expect(t).to.be.a("string"));
          });

          pm.test("author is embedded, not just an id", () =>
              pm.expect(posts[0].author).to.have.property("username"));

          pm.test("newest first", () => {
              const dates = posts.map((p) => Date.parse(p.date_posted));
              pm.expect(dates).to.eql([...dates].sort((a, b) => b - a));
          });
      }
    language: text/javascript
order: 1000
