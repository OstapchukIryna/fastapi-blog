$kind: http-request
url: "{{baseUrl}}/api/v1/posts/{{postId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));

      const post = pm.response.json();

      pm.test("detail adds content on top of the list shape", () => {
          pm.expect(post).to.have.property("content");
          pm.expect(Object.keys(post).sort()).to.eql(
              ["author", "content", "date_posted", "id", "is_pinned", "outline",
               "reading_minutes", "summary", "tags", "title"]);
      });
    language: text/javascript
order: 5000
