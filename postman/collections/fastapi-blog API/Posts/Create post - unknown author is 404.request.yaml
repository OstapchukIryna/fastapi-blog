$kind: http-request
description: The author arrives in the body rather than the path, so the id dependency never sees it and the route checks by hand.
url: "{{baseUrl}}/api/posts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Orphan",
      "summary": "No such author.",
      "content": "x",
      "tags": [],
      "user_id": 99999999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("404 Not Found", () => pm.response.to.have.status(404));
      pm.test("blames the user, not the post", () =>
          pm.expect(pm.response.json().detail).to.eql("User not found"));
    language: text/javascript
order: 3000
