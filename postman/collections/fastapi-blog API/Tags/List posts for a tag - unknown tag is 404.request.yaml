$kind: http-request
description: "An unused tag is not an empty list: the tag itself does not exist, and saying so is more useful than an empty array."
url: "{{baseUrl}}/api/v1/tags/no-such-tag-exists/posts"
method: GET
scripts:
  - type: afterResponse
    code: pm.test("404 Not Found", () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
