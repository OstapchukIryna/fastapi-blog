[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.140.0",
    "greenlet>=3.5.4",
    "markdown>=3.10.2",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**", "**/__pycache__/**"]

[dependency-groups]
dev = [
    "djlint>=1.42.3",
    "pyrefly>=1.1.0",
    "pytest-playwright>=0.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Только chromium: три сценария проверяют логику страниц, а не отличия
# движков. Прогнать шире — `--browser firefox --browser webkit`.
addopts = "--browser chromium"
