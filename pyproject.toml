[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.0",
    "boto3>=1.43.65",
    "fastapi[standard]>=0.140.0",
    "greenlet>=3.5.4",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**", "**/__pycache__/**"]
search-path = ["src", "."]

[tool.ruff]
src = ["src"]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "djlint>=1.43.2",
    "httpx>=0.28.1",
    "hypothesis>=6.165.2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "moto[s3]>=5.2.2",
    "pre-commit>=4.6.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/blog"]
branch = true

[tool.fastapi]
entrypoint = "blog.main:app"
