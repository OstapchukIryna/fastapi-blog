[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.0",
    "boto3>=1.43.65",
    "fastapi[standard]>=0.140.0",
    "greenlet>=3.5.4",
    "markdown>=3.10.3",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**", "**/__pycache__/**"]
search-path = ["src", "."]
typeCheckingMode = "strict"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "djlint>=1.42.3",
    "httpx>=0.28.1",
    "hypothesis>=6.165.2",
    "moto[s3]>=5.2.2",
    "pre-commit>=4.6.1",
    "pyrefly>=1.1.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]


[tool.ruff.lint]
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests", "src/blog"]
addopts = "-ra -q --doctest-modules"

[tool.coverage.run]
source = ["src/blog"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.fastapi]
entrypoint = "blog.main:app"
