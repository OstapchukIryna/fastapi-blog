[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.19.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.65",
    "fastapi[standard]>=0.140.0",
    "greenlet>=3.5.4",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = [".venv/**", "**/__pycache__/**"]
search-path = ["src", "."]

[tool.ruff]
src = ["src"]

[dependency-groups]
dev = [
    "djlint>=1.42.3",
    "httpx>=0.28.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "pyrefly>=1.1.0",
    "pytest-playwright>=0.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
ignore = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--browser chromium"

[tool.fastapi]
# ! `blog.main`, not `src.blog.main`. Both import — `src` works as a
# ! namespace package from the repository root — but they are two
# ! different module objects, so the second one builds a second FastAPI
# ! application. The models stay shared, because every import inside the
# ! package is absolute (`blog.…`), which is what makes the duplication
# ! quiet rather than loud. `blog` is the installed name; use it.
entrypoint = "blog.main:app"
