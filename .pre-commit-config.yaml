# Mirrors the "Lint, types, docs" job in .github/workflows/ci.yml, so a
# violation is caught before it reaches a push rather than after. Local
# hooks run through `uv run`, the same tool versions uv.lock pins for CI —
# a hook repo pinned to its own version would drift from that over time.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check src seed.py populate.py tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: djlint
        name: djlint templates/ --check
        entry: uv run djlint templates/ --check
        language: system
        files: ^templates/
        pass_filenames: false

      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check src/blog seed.py populate.py tests scripts
        language: system
        types: [python]
        pass_filenames: false
