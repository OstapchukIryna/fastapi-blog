
<div class="modal fade"
     id="successModal"
     tabindex="-1"
     data-bs-theme="dark"
     aria-labelledby="successModalLabel"
     aria-describedby="successMessage"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title is-success" id="successModalLabel">Saved</h2>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="modal-message mb-0" id="successMessage"></p>
            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-light write-btn"
                        id="successAction"
                        data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade"
     id="errorModal"
     tabindex="-1"
     role="alertdialog"
     data-bs-theme="dark"
     aria-labelledby="errorModalLabel"
     aria-describedby="errorMessage"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title is-danger" id="errorModalLabel">Not saved</h2>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="modal-message mb-0" id="errorMessage"></p>
            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn record-btn"
                        id="errorAction"
                        data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
