name: checks

# Когда запускать. push в main — чтобы основная ветка всегда была зелёной,
# pull_request — чтобы поломка обнаружилась до слияния, а не после
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Склонировать репозиторий в контейнер — без этого шага там пусто
      - uses: actions/checkout@v4

      # Версию Python отдельно указывать не нужно:
      # uv прочитает её из .python-version, как и локально
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked падает, если uv.lock разошёлся с pyproject.toml.
      # Это ловит классическое «добавила зависимость, лок не закоммитила»
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # format --check ничего не переписывает, только сообщает о расхождении:
      # менять файлы на стороне CI — плохая практика, история должна
      # соответствовать тому, что человек реально закоммитил
      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyrefly check
