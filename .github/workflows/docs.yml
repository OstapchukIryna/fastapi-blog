# Publishes the documentation site to GitHub Pages.
#
# Separate from ci.yml because it does something rather than checks
# something: it runs only on master, and only after the change is already
# merged. CI builds the same site with --strict on every pull request, so
# a broken build is caught before it can reach here.
#
# ! Inert until Pages is enabled for the repository with "GitHub Actions"
# ! as the source (Settings -> Pages). Until then this workflow runs and
# ! the deploy step fails; nothing else is affected.
name: Docs

on:
  push:
    branches: [master]
    # Nothing else can change the rendered site: the pages come from
    # docs/, the reference from the docstrings in src/.
    paths:
      - "docs/**"
      - "src/**"
      - mkdocs.yml
      - .github/workflows/docs.yml
  # So the site can be republished without an empty commit.
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Build
        run: uv run mkdocs build --strict
        env:
          SECRET_KEY: docs-build-only-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
