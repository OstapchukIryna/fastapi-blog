name: checks

on:
  push:
    branches: [main, master]
  pull_request:

# Отменяет предыдущий запуск на той же ветке: два пуша подряд не должны
# гоняться параллельно и тем более деплоиться в обратном порядке.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGION: europe-west3
  SERVICE: fastapi-service
  REPOSITORY: fastapi-repo
  IMAGE: app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версию Python отдельно не задаём: uv читает её из .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked падает, если uv.lock разошёлся с pyproject.toml —
      # ловит «добавила зависимость, лок не закоммитила»
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # --check ничего не переписывает, только сообщает: правки,
      # сделанные автоматикой на сервере, не попадают в твою историю,
      # и локально ты продолжишь коммитить неотформатированное
      - name: Format
        run: uv run ruff format --check .

      - name: Templates
        run: uv run djlint templates/ --check

      - name: Type check
        run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest

    # Postgres сервис-контейнером: тесты бьются о ту же СУБД, что стоит
    # в проде. На SQLite они были бы зелёными и там, где прод падает.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpassword
          POSTGRES_DB: test_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloguser -d test_blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # DATABASE_URL нужен и alembic, и pytest — conftest.py задаёт то же
    # самое значение сам, поэтому здесь просто общий env для job.
    # S3_BUCKET_NAME и SECRET_KEY нужны только alembic: Settings() требует
    # их при любом импорте blog.core.config, а pytest ставит свои до
    # того, как что-то импортирует, но отдельный процесс alembic
    # импортирует напрямую и своих значений не получает.
    env:
      DATABASE_URL: postgresql+psycopg://bloguser:blogpassword@localhost/test_blog
      S3_BUCKET_NAME: ci-placeholder-bucket
      # secret_key требует минимум 32 символа — сам run_id столько не
      # гарантирует, отсюда хвост.
      SECRET_KEY: ci-run-only-${{ github.run_id }}-${{ github.run_attempt }}-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Ловит модель, изменённую без миграции: alembic check
      # автогенерирует диф против уже смигрированной базы и падает,
      # если он не пустой. create_all в conftest.py после этого не
      # конфликтует — checkfirst пропускает то, что уже есть.
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest -q

  api:
    runs-on: ubuntu-latest

    # Тот же движок и та же база, что у test: коллекция ходит через
    # настоящий API, значит пишет в ту же базу, на которой API реально
    # стоит. Порт и имя базы совпадают с тем, что scripts/api-tests.sh
    # прописывает сам.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpassword
          POSTGRES_DB: test_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloguser -d test_blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # В отличие от test, здесь загрузка и удаление файла идут через
    # настоящий S3 — «Upload a picture» и соседние запросы дергают
    # AWSAvatars по-настоящему, макет тут не подходит.
    env:
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Newman — Node-инструмент, коллекция собирается Python-скриптом
      # из дерева YAML под postman/.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the collection
        run: ./scripts/api-tests.sh

  deploy:
    # Только с основной ветки и только после зелёных проверок. На PR
    # джоб не запускается вовсе — деплоить непринятый код незачем.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [lint, test, api]
    runs-on: ubuntu-latest

    # Нужно для Workload Identity Federation: GitHub выдаёт короткоживущий
    # токен, который Google обменивает на доступ. Ключа сервисного
    # аккаунта в секретах нет — нечему утекать и нечего ротировать.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Тег — SHA коммита, а не только latest. Cloud Run различает
      # ревизии по образу: с постоянным тегом он может не заметить, что
      # содержимое поменялось, и откатываться станет не к чему.
      - name: Build and push
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${IMAGE}"
          docker build --platform linux/amd64 \
            -t "${IMAGE_URI}:${GITHUB_SHA}" \
            -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      # Миграции до деплоя, разовой задачей. В CMD приложения им не
      # место: инстансов Cloud Run может быть несколько, и каждый
      # запускал бы alembic одновременно.
      #
      # Settings() требует database_url, secret_key и s3_bucket_name даже
      # только чтобы импортировать blog.core.config — alembic/env.py
      # делает это раньше, чем доходит до миграций, так что без всех
      # трёх джоб падает на импорте, а не на самих миграциях.
      - name: Run migrations
        run: |
          gcloud run jobs deploy migrate \
            --region "${REGION}" \
            --image "${IMAGE_URI}:${GITHUB_SHA}" \
            --command alembic --args upgrade,head \
            --set-secrets DATABASE_URL=database-url:latest,DIRECT_DATABASE_URL=direct-database-url:latest,SECRET_KEY=secret-key:latest \
            --set-env-vars "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" \
            --quiet
          gcloud run jobs execute migrate --region "${REGION}" --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --region "${REGION}" \
            --image "${IMAGE_URI}:${GITHUB_SHA}" \
            --quiet

      # Проверяем то, что уехало, а не то, что собралось: деплой может
      # пройти, а приложение — не подняться из-за конфигурации.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -o /dev/null -s -w "%{http_code}" https://calledmad.com/api/health) || true
            [ "$code" = "200" ] && exit 0
            echo "health returned ${code:-nothing} (${i}/10)"
            sleep 6
          done
          echo "the site did not come back healthy" >&2
          exit 1