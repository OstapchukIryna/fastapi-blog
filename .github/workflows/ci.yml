# Every gate that has to pass before a change can be merged.
#
# Three jobs rather than one long chain: they are independent, they run in
# parallel, and a failure names which kind of check broke instead of
# stopping at the first one. The whole run is a few minutes.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A second push to the same branch supersedes the first: nobody needs the
# result of a run against code that no longer exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The application refuses to start without a secret, and the docs build
  # imports it to read the docstrings. Generated per run rather than kept
  # in the repository's secrets: nothing here signs a token anybody will
  # ever present again, and a stored value invites reuse somewhere it
  # would matter.
  SECRET_KEY: ci-run-only-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  static:
    name: Lint, types, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked is the dependency gate: it refuses to run if uv.lock does
      # not match pyproject.toml, so a dependency added without relocking
      # fails here rather than on somebody else's machine.
      - name: Install
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check src seed.py populate.py tests scripts

      - name: djlint
        run: uv run djlint templates/ --check

      - name: Types
        run: uv run pyrefly check src/blog seed.py populate.py tests scripts

      # --strict turns a broken link or an unreferenced page into a
      # failure. The docs are built here even though publishing happens
      # elsewhere, so a pull request cannot merge documentation that does
      # not build.
      - name: Docs
        run: uv run mkdocs build --strict

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # Only chromium: the browser tests check the pages' logic, not how
      # engines differ. --with-deps brings the system libraries a headless
      # browser needs on a bare runner.
      - name: Install browser
        run: uv run playwright install --with-deps chromium

      - name: pytest
        run: uv run pytest

      # A failed browser test is far easier to read as a screenshot and a
      # trace than as a stack trace.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Newman is a Node tool; the collection itself is built from the
      # YAML tree under postman/ by a Python script.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: uv sync --locked

      - name: Run the collection
        run: ./scripts/api-tests.sh
