# Every gate that has to pass before a change can be merged.
#
# Three jobs rather than one long chain: they are independent, they run in
# parallel, and a failure names which kind of check broke instead of
# stopping at the first one. The whole run is a few minutes.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A second push to the same branch supersedes the first: nobody needs the
# result of a run against code that no longer exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The application refuses to start without a secret, and the docs build
  # imports it to read the docstrings. Generated per run rather than kept
  # in the repository's secrets: nothing here signs a token anybody will
  # ever present again, and a stored value invites reuse somewhere it
  # would matter.
  SECRET_KEY: ci-run-only-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  static:
    name: Lint, types, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked is the dependency gate: it refuses to run if uv.lock does
      # not match pyproject.toml, so a dependency added without relocking
      # fails here rather than on somebody else's machine.
      - name: Install
        run: uv sync --locked

      # Checks the locked dependencies against OSV, not the code — a
      # separate question from "does uv.lock match pyproject.toml" above.
      # Still marked experimental by uv itself.
      - name: Audit dependencies
        run: uv audit --preview-features audit-command

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check src seed.py populate.py tests scripts

      - name: djlint
        run: uv run djlint templates/ --check

      - name: Types
        run: uv run pyrefly check src/blog seed.py populate.py tests scripts

      # --strict turns a broken link or an unreferenced page into a
      # failure. The docs are built here even though publishing happens
      # elsewhere, so a pull request cannot merge documentation that does
      # not build.
      - name: Docs
        run: uv run mkdocs build --strict

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # The tests run on PostgreSQL because the application does. They used
    # to run on SQLite, which meant anything the two engines disagree
    # about was untested by construction — timezone handling on a
    # timestamp being the one that had already bitten.
    #
    # User, password and database name match tests/conftest.py exactly:
    # it hardcodes this connection rather than reading DATABASE_URL, so
    # the service has to meet it there instead of the other way round.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpassword
          POSTGRES_DB: test_blog
        ports:
          - 5432:5432
        # Without this the steps start racing the container: postgres
        # accepts TCP before it accepts queries.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Only the migration check below reads this — pytest ignores it and
      # connects where tests/conftest.py says to, which is this same
      # database under the same name.
      DATABASE_URL: postgresql+psycopg://bloguser:blogpassword@localhost:5432/test_blog
      # Settings() refuses to build without a bucket name, and importing
      # blog.core.config is enough to trip that — nothing in this job
      # uploads anything, so a real bucket is not needed here, only a
      # value that lets Settings() construct.
      S3_BUCKET_NAME: ci-placeholder-bucket

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # The gate that catches the failure this whole change is about: a
      # migration that has drifted from the models. `check` autogenerates
      # against the migrated database and fails if the diff is not empty,
      # so a model edited without a migration stops here instead of on a
      # deploy. Cheap — it is one connection and no data.
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: pytest
        run: uv run pytest

  api:
    name: API contract
    runs-on: ubuntu-latest

    # Same engine as the tests job, and for the same reason: the
    # collection writes through the real API, so it should write into the
    # database the API actually runs on. Same credentials and database
    # name too — scripts/api-tests.sh hardcodes this exact connection,
    # matching tests/conftest.py, rather than reading it from here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bloguser
          POSTGRES_PASSWORD: blogpassword
          POSTGRES_DB: test_blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Unlike the tests job, this one really does upload and delete a
      # file through the API — "Upload a picture" and friends exercise
      # AWSAvatars for real, so it needs real S3 credentials. Set these
      # under Settings -> Secrets and variables -> Actions.
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_REGION: ${{ secrets.S3_REGION || 'eu-north-1' }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Newman is a Node tool; the collection itself is built from the
      # YAML tree under postman/ by a Python script.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: uv sync --locked

      - name: Run the collection
        run: ./scripts/api-tests.sh
